# XLS-26 token metadata for Pond Protocol.
#
# Served at https://pond.greenhead.io/.well-known/xrp-ledger.toml
#
# WEBSITE HOST vs ON-LEDGER DOMAIN — these are not the same thing.
#
#   Website host (this file):  pond.greenhead.io
#     Lowercase, no scheme. This is the Replit custom domain the docs site
#     deploys to. HTTPS URLs in [[TOKENS.URLS]] use https://pond.greenhead.io.
#
#   On-ledger issuer Domain:   UNSET, and it stays unset.
#     CORS on this path has not been verified against a live deploy. XLS-26 is
#     not a two-way link until Domain matches this host AND the file is served
#     with Access-Control-Allow-Origin: *. Do not set Domain as part of
#     attaching this host.
#
# pond.greenhead.io is a name the owner holds (a subdomain of greenhead.io).
# That is a better permanence story than a Cloudflare pages.dev hostname, but
# it is still not a reason to bind Domain today. After blackholing, whatever
# Domain is set at that moment is frozen forever.
#
# Remaining TODOs in this file (each marked TODO below where it applies):
#   1. icon — served at https://pond.greenhead.io/icon-512.png (pond-ripple mark).
#   2. [[PRINCIPALS]] — omitted on purpose. It attaches a real name and email.
#      XLS-26 does not require it.
#   3. $rPND stanza — absent until MPTokenIssuanceCreate is validated.
#
# Field reference: https://xls.xrpl.org/xls/XLS-0026-iou-token-metadata.html

[[ISSUERS]]
address = "rPNDRmfNNrUZstkA23haCUkCp7qLEPnaYc"
name = "Pond Protocol"
desc = "Issuer of $PND, an XRP Ledger issued currency, and $rPND, a Multi-Purpose Token."

[[TOKENS]]
currency = "PND"
issuer = "rPNDRmfNNrUZstkA23haCUkCp7qLEPnaYc"
name = "PND"
desc = "The issued-currency token of Pond Protocol on the XRP Ledger."
asset_class = "memes"
# icon is served from this host at /icon-512.png (pond-ripple mark, same as favicon).
icon = "https://pond.greenhead.io/icon-512.png"

[[TOKENS.URLS]]
url = "https://pond.greenhead.io"
type = "website"
title = "Official website"

[[TOKENS.URLS]]
url = "https://pond.greenhead.io/verify/"
type = "document"
title = "Verify the issuer"

# ---------------------------------------------------------------------------------------------
# $rPND is deliberately absent.
#
# The MPT has not been created on mainnet, so it has no MPTokenIssuanceID to reference. Add a
# stanza only after MPTokenIssuanceCreate is validated. Note also that MPT DEX and AMM support
# depends on a ledger amendment that is not yet enabled on mainnet.
# ---------------------------------------------------------------------------------------------

# [[PRINCIPALS]] is intentionally omitted. It attaches a real name and email address to the
# project, which is a disclosure decision rather than a technical one. XLS-26 does not require it.
# TODO: decide whether to include [[PRINCIPALS]] once a real contact is chosen. Do not invent one.
