name: Docs site

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "README.md", ".github/workflows/docs-site.yml"]
  pull_request:
    paths: ["site/**", "docs/**", "README.md", ".github/workflows/docs-site.yml"]
  # A documentation change in pnd or rpnd cannot trigger this repository's workflows, so the
  # staleness job also runs on a schedule. Without it, a correction landing in a sibling repo would
  # sit undetected until somebody happened to touch site/ here.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Layer 2 of the staleness defence: does each vendored copy in site/imported/ still match its
  # source in the repository it came from?
  #
  # This is a separate job because it is the only one that needs the sibling repositories. The
  # render build is deliberately hermetic — see the comment on the deploy job — so nothing else here
  # can detect that a document was corrected upstream after it was vendored.
  #
  # Layer 1 (a recorded source hash, checked in every build including on the deploy host) catches a
  # vendored file edited by hand. It cannot catch upstream drift, which is what this job is for.
  staleness:
    name: Vendored docs match their sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: protocol

      # Reading another private repository in the same org needs a token the default GITHUB_TOKEN
      # does not provide. Create a fine-grained PAT or GitHub App token with Contents: read on
      # PondProtocol/PND and PondProtocol/rPND, and store it as the SIBLING_REPOS_TOKEN secret.
      #
      # This job fails loudly rather than skipping when the secret is missing. A staleness check
      # that quietly does nothing is worse than none: it reports success while the site publishes
      # documentation the source repositories have already corrected.
      - name: Check the cross-repo token exists
        env:
          TOKEN: ${{ secrets.SIBLING_REPOS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::SIBLING_REPOS_TOKEN is not set."
            echo "This job compares site/imported/ against the pnd and rpnd repositories, which are"
            echo "private, so it needs a token with Contents: read on both."
            echo
            echo "Create a fine-grained PAT (or GitHub App installation token) scoped to"
            echo "PondProtocol/PND and PondProtocol/rPND, then add it as a repository secret named"
            echo "SIBLING_REPOS_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          repository: PondProtocol/PND
          path: pnd
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
          # Full history: content.config.json may pin a source to a branch other than the default,
          # and a shallow single-branch clone cannot resolve one.
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: PondProtocol/rPND
          path: rpnd
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: protocol/site/package-lock.json

      - name: Install
        working-directory: protocol/site
        run: npm ci

      # Fetch whatever refs the config declares, rather than hardcoding branch names here. Keeping
      # the ref list in one place is what stops a pin being forgotten in a second location.
      - name: Fetch the declared source refs
        working-directory: protocol/site
        run: |
          node scripts/sync.mjs --print-refs | while IFS=$'\t' read -r repo dir ref; do
            echo "$repo -> $ref"
            case "$ref" in
              worktree) continue ;;
              origin/*) git -C "$dir" fetch --quiet origin "${ref#origin/}:refs/remotes/$ref" || true ;;
              *)        git -C "$dir" fetch --quiet origin "$ref" || true ;;
            esac
          done

      - name: Compare vendored copies against their sources
        working-directory: protocol/site
        run: npm run sync -- --check

  # Runs on every pull request. Host-independent: it only proves the site builds and that the
  # publication guard passes, which is worth having whichever host is chosen.
  build:
    name: Build and guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      # The vendored copies in site/imported/ are checked in, so the build does not need the
      # sibling repositories. This step only asserts they were not hand-edited into an
      # inconsistent state; it is skipped because the sibling repos are not checked out here.
      - name: Build (strict) and run the publication guard
        working-directory: site
        run: npm run check

      # Belt and braces on top of the guard's own assertion. If this ever fails, do not deploy:
      # a missing .well-known is a silent 404 on the path the issuer's Domain field points at.
      - name: Assert the identity anchor is present at the exact path
        working-directory: site
        run: |
          test -f dist/.well-known/xrp-ledger.toml
          echo "dist/.well-known/xrp-ledger.toml present ($(wc -c < dist/.well-known/xrp-ledger.toml) bytes)"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/dist
          # Without this, the dot-directory is dropped. Same defect as the Pages artifact
          # action below; see that comment for the verified detail.
          include-hidden-files: true
          retention-days: 7

  # Deploys to GitHub Pages. Disabled unless the repository variable DEPLOY_GITHUB_PAGES is
  # set to "true", because:
  #
  #   * GitHub Pages on a PRIVATE repository requires a paid plan. Quoting GitHub's docs as of
  #     2026-09-15: "GitHub Pages is available in public repositories with GitHub Free and GitHub
  #     Free for organizations, and in public and private repositories with GitHub Pro, GitHub
  #     Team, GitHub Enterprise Cloud, and GitHub Enterprise Server." This repository is private.
  #
  #   * A GitHub Pages site is publicly visible even when its source repository is private, so
  #     enabling this publishes every page in the allowlist to the open internet.
  #
  # See docs/hosting-decision.md before turning this on.
  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_GITHUB_PAGES == 'true'
    # Deliberately depends on staleness as well as build. Publishing documentation that the source
    # repositories have already corrected is the defect this whole arrangement exists to prevent, so
    # a deploy should not proceed while that is unverified.
    needs: [staleness, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run check

      - uses: actions/configure-pages@v5

      # include-hidden-files is REQUIRED, not optional.
      #
      # actions/upload-pages-artifact defaults it to "false", and when false it archives the site
      # with `tar --exclude=.[^/]*`. Verified locally with GNU tar 1.35 on 2026-09-15: that glob
      # removes .well-known/ from the artifact entirely. The workflow still succeeds, the deploy
      # still reports success, and /.well-known/xrp-ledger.toml 404s in production.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v4

      # GitHub Pages cannot set response headers, so Content-Type on a .toml file is whatever
      # GitHub decides. This step reports the live headers rather than asserting them, so the
      # actual behaviour is recorded in the run log the first time a real deploy happens.
      - name: Report live headers on the identity anchor
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Fetching ${url%/}/.well-known/xrp-ledger.toml"
          curl -sS -I -H 'Origin: https://xrplmeta.org' "${url%/}/.well-known/xrp-ledger.toml" || true
          echo
          echo "Expected: HTTP 200, access-control-allow-origin: *"
          echo "Note: GitHub Pages offers no way to set Content-Type. If an XLS-26 consumer"
          echo "rejects the content type, that is not fixable on this host."
