name: Docs site

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "README.md", ".github/workflows/docs-site.yml"]
  pull_request:
    paths: ["site/**", "docs/**", "README.md", ".github/workflows/docs-site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on every pull request. Host-independent: it only proves the site builds and that the
  # publication guard passes, which is worth having whichever host is chosen.
  build:
    name: Build and guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      # The vendored copies in site/imported/ are checked in, so the build does not need the
      # sibling repositories. This step only asserts they were not hand-edited into an
      # inconsistent state; it is skipped because the sibling repos are not checked out here.
      - name: Build (strict) and run the publication guard
        working-directory: site
        run: npm run check

      # Belt and braces on top of the guard's own assertion. If this ever fails, do not deploy:
      # a missing .well-known is a silent 404 on the path the issuer's Domain field points at.
      - name: Assert the identity anchor is present at the exact path
        working-directory: site
        run: |
          test -f dist/.well-known/xrp-ledger.toml
          echo "dist/.well-known/xrp-ledger.toml present ($(wc -c < dist/.well-known/xrp-ledger.toml) bytes)"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/dist
          # Without this, the dot-directory is dropped. Same defect as the Pages artifact
          # action below; see that comment for the verified detail.
          include-hidden-files: true
          retention-days: 7

  # Deploys to GitHub Pages. Disabled unless the repository variable DEPLOY_GITHUB_PAGES is
  # set to "true", because:
  #
  #   * GitHub Pages on a PRIVATE repository requires a paid plan. Quoting GitHub's docs as of
  #     2026-09-15: "GitHub Pages is available in public repositories with GitHub Free and GitHub
  #     Free for organizations, and in public and private repositories with GitHub Pro, GitHub
  #     Team, GitHub Enterprise Cloud, and GitHub Enterprise Server." This repository is private.
  #
  #   * A GitHub Pages site is publicly visible even when its source repository is private, so
  #     enabling this publishes every page in the allowlist to the open internet.
  #
  # See docs/hosting-decision.md before turning this on.
  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_GITHUB_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run check

      - uses: actions/configure-pages@v5

      # include-hidden-files is REQUIRED, not optional.
      #
      # actions/upload-pages-artifact defaults it to "false", and when false it archives the site
      # with `tar --exclude=.[^/]*`. Verified locally with GNU tar 1.35 on 2026-09-15: that glob
      # removes .well-known/ from the artifact entirely. The workflow still succeeds, the deploy
      # still reports success, and /.well-known/xrp-ledger.toml 404s in production.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v4

      # GitHub Pages cannot set response headers, so Content-Type on a .toml file is whatever
      # GitHub decides. This step reports the live headers rather than asserting them, so the
      # actual behaviour is recorded in the run log the first time a real deploy happens.
      - name: Report live headers on the identity anchor
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Fetching ${url%/}/.well-known/xrp-ledger.toml"
          curl -sS -I -H 'Origin: https://xrplmeta.org' "${url%/}/.well-known/xrp-ledger.toml" || true
          echo
          echo "Expected: HTTP 200, access-control-allow-origin: *"
          echo "Note: GitHub Pages offers no way to set Content-Type. If an XLS-26 consumer"
          echo "rejects the content type, that is not fixable on this host."
